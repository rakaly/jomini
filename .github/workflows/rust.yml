name: ci
on:
  pull_request:
  push:
    branches:
    - master
  schedule:
  - cron: '00 01 * * *'
  workflow_dispatch:

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: clippy
    - name: Run clippy
      run: cargo clippy -p jomini -p jomini_derive --all-features --all-targets -- -D warnings
    # Game crates carry wasm-only features (tsify), so they are checked with
    # default features.
    - name: Run clippy (game crates)
      run: cargo clippy --workspace --exclude jomini --exclude jomini_derive --all-targets -- -D warnings

  testbench:
    name: testbench
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Check formatting
      run: cargo fmt --manifest-path bench/Cargo.toml --all -- --check
    - name: Run clippy
      run: cargo clippy --manifest-path bench/Cargo.toml --all-targets -- -D warnings
    - name: Build benchmark (criterion)
      run: cargo bench --manifest-path bench/Cargo.toml --bench jomini-bench-criterion -- --test
    - name: Build benchmark (gungraun)
      run: cargo bench --manifest-path bench/Cargo.toml --bench jomini-bench-gungraun --no-run
    - name: Run clippy (json benchmark)
      run: cargo clippy --manifest-path bench/Cargo.toml --all-targets --features json -- -D warnings
    - name: Build benchmark (criterion, json)
      run: cargo bench --manifest-path bench/Cargo.toml --features json --bench jomini-bench-criterion -- --test
    - name: Build benchmark (gungraun, json)
      run: cargo bench --manifest-path bench/Cargo.toml --features json --bench jomini-bench-gungraun --no-run

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: miri
    - name: Run miri
      # trybuild in jomini_derive cannot run under Miri
      run: cargo miri test -p jomini
      env:
        MIRIFLAGS: -Zmiri-tree-borrows

  # One job per game crate so that fixture caches and failures stay separate.
  games:
    name: games (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - { crate: eu4save, game: eu4 }
        - { crate: ck3save, game: ck3 }
        - { crate: hoi4save, game: hoi4 }
        - { crate: imperator-save, game: imperator }
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    # Save fixtures are fetched from a CDN on first use. The cache key hashes
    # the set of fixture names the tests reference, so it changes only when a
    # fixture is added, removed, or renamed, not on every test edit.
    #
    # This job only restores. The ironman job fetches a superset of the
    # fixtures and is the one that saves the cache, so there is one cache per
    # game and it always holds the full set.
    - name: Fixture set
      id: fixtures
      run: |
        hash=$(grep -rhoE '"[A-Za-z0-9_.-]+\.(eu4|ck3|hoi4|rome|v3|eu5)"' crates/${{ matrix.crate }}/tests \
          | sort -u | sha256sum | cut -c1-16)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
    - name: Restore save fixtures
      uses: actions/cache/restore@v6
      with:
        path: assets/saves/${{ matrix.game }}
        key: saves-${{ matrix.game }}-${{ steps.fixtures.outputs.hash }}
        restore-keys: saves-${{ matrix.game }}-
    - name: Check jomini resolves from the workspace
      run: cargo tree -p ${{ matrix.crate }} -i jomini -e normal --depth 0 | grep -q 'crates/jomini'
    - name: Run tests
      run: cargo test -p ${{ matrix.crate }}

  # Runs the ironman tests with the private token files. Tokens never reach a
  # runner that executes code from a fork:
  #
  # - The job runs on pushes to master, on the schedule, and on pull requests
  #   from branches in this repository. GitHub withholds secrets from fork
  #   pull requests, and the condition below skips them so the token clone
  #   does not fail with an empty token. Dependabot pull requests also run
  #   without secrets and are skipped for the same reason.
  # - The `ironman` environment holds GH_PAT, a fine-grained token with
  #   read-only access to pdx-tools/tokens. The tests find the token files
  #   through PDX_TOKENS_DIR (see crates/pdx-fixtures).
  # - The fixture cache path never includes the tokens directory. A cache
  #   written here is restorable by fork pull requests.
  # - Test output is captured, and the token checkout is removed afterwards
  #   so no later step can upload it.
  #
  # The ironman tests fetch a superset of the fixtures the token-less job
  # touches, so this is the job that saves the fixture cache.
  ironman:
    name: ironman (${{ matrix.crate }})
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    environment: ironman
    strategy:
      fail-fast: false
      matrix:
        include:
        - { crate: eu4save, game: eu4 }
        - { crate: ck3save, game: ck3 }
        - { crate: hoi4save, game: hoi4 }
        - { crate: imperator-save, game: imperator }
    env:
      PDX_TOKENS_DIR: ${{ github.workspace }}/.tokens/tokens
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    - name: Fixture set
      id: fixtures
      run: |
        hash=$(grep -rhoE '"[A-Za-z0-9_.-]+\.(eu4|ck3|hoi4|rome|v3|eu5)"' crates/${{ matrix.crate }}/tests \
          | sort -u | sha256sum | cut -c1-16)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
    - name: Cache save fixtures
      uses: actions/cache@v6
      with:
        path: assets/saves/${{ matrix.game }} # never the tokens directory
        key: saves-${{ matrix.game }}-${{ steps.fixtures.outputs.hash }}
        restore-keys: saves-${{ matrix.game }}-
    - name: Clone tokens
      uses: actions/checkout@v7
      with:
        repository: pdx-tools/tokens
        token: ${{ secrets.GH_PAT }}
        path: .tokens
        persist-credentials: false
    - name: Run tests
      run: cargo test -p ${{ matrix.crate }}
    - name: Remove tokens
      if: always()
      run: rm -rf .tokens

  test:
    name: test
    runs-on: ${{ matrix.os }}
    env:
      CARGO: cargo
      TARGET:
      # The cross-compile and miri legs run only the published crates. Game
      # crates get their own linux-only job.
      PKGS: -p jomini -p jomini_derive
    strategy:
      matrix:
        build:
        - stable
        - beta
        - nightly
        - macos
        - win-msvc
        - big-endian
        - stable-32
        include:
        - build: stable
          os: ubuntu-latest
          rust: stable
        - build: beta
          os: ubuntu-latest
          rust: beta
        - build: nightly
          os: ubuntu-latest
          rust: nightly
        - build: macos
          os: macos-latest
          rust: stable
        - build: win-msvc
          os: windows-latest
          rust: stable
        - build: big-endian
          os: ubuntu-latest
          rust: stable
          target: powerpc64-unknown-linux-gnu
        - build: stable-32
          os: ubuntu-latest
          rust: stable
          target: i686-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Use Cross
      if: matrix.target != ''
      run: |
        cargo install cross
        echo "CARGO=cross" >> $GITHUB_ENV
        echo "TARGET=--target ${{ matrix.target }}" >> $GITHUB_ENV
    - name: Build
      run: ${{ env.CARGO }} build ${{ env.PKGS }} --verbose ${{ env.TARGET }}
    - name: Run default features tests
      run: ${{ env.CARGO }} test ${{ env.PKGS }} --verbose ${{ env.TARGET }}
    - name: Run no-default-feature tests
      run: ${{ env.CARGO }} test --no-default-features ${{ env.PKGS }} --verbose ${{ env.TARGET }}
    - name: Run json tests
      run: ${{ env.CARGO }} test --features json ${{ env.PKGS }} --verbose ${{ env.TARGET }}
    - name: Run envelope tests
      run: ${{ env.CARGO }} test --features envelope ${{ env.PKGS }} --verbose ${{ env.TARGET }}
    - name: Run all-features tests
      run: ${{ env.CARGO }} test --all-features ${{ env.PKGS }} --verbose ${{ env.TARGET }}
    - name: Run serde-only tests (no derive macros)
      run: ${{ env.CARGO }} test --no-default-features --features serde ${{ env.PKGS }} --verbose ${{ env.TARGET }}

    - name: Compile fuzz
      if: matrix.build == 'nightly'
      run: |
        cargo install cargo-fuzz
        cargo fuzz build fuzz_binary
        cargo fuzz build fuzz_scalar_text
        cargo fuzz build fuzz_text
        cargo fuzz build fuzz_date
        cargo fuzz build fuzz_envelope
        cargo fuzz build fuzz_eu4
        cargo fuzz build fuzz_ck3
        cargo fuzz build fuzz_hoi4
        cargo fuzz build fuzz_imperator
