name: ci
on:
  pull_request:
  push:
    branches:
    - master
  schedule:
  - cron: '00 01 * * *'
  workflow_dispatch:

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: clippy
    - name: Run clippy
      run: cargo clippy -p jomini -p jomini_derive -p arena-serde -p arena-serde-derive --all-features --all-targets -- -D warnings
    # Game crates carry wasm-only features (tsify), so they are checked with
    # default features.
    - name: Run clippy (game crates)
      run: cargo clippy --workspace --exclude jomini --exclude jomini_derive --exclude arena-serde --exclude arena-serde-derive --all-targets -- -D warnings

  testbench:
    name: testbench
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: rustfmt, clippy
    - name: Restore save fixtures
      uses: actions/cache/restore@v6
      with:
        path: assets/saves/eu4
        key: saves-eu4-${{ hashFiles('crates/eu4save/tests/fixtures.txt') }}
        restore-keys: saves-eu4-
    - name: Check formatting
      run: cargo fmt --manifest-path bench/Cargo.toml --all -- --check
    - name: Run clippy
      run: cargo clippy --manifest-path bench/Cargo.toml --all-targets -- -D warnings
    - name: Build benchmark (criterion)
      run: cargo bench --manifest-path bench/Cargo.toml --bench jomini-bench-criterion -- --test
    - name: Build benchmark (gungraun)
      run: cargo bench --manifest-path bench/Cargo.toml --bench jomini-bench-gungraun --no-run
    - name: Run clippy (json benchmark)
      run: cargo clippy --manifest-path bench/Cargo.toml --all-targets --features json -- -D warnings
    - name: Build benchmark (criterion, json)
      run: cargo bench --manifest-path bench/Cargo.toml --features json --bench jomini-bench-criterion -- --test
    - name: Build benchmark (gungraun, json)
      run: cargo bench --manifest-path bench/Cargo.toml --features json --bench jomini-bench-gungraun --no-run

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: miri
    - name: Run miri
      run: cargo miri test -p jomini -p jomini_derive -p arena-serde
      env:
        MIRIFLAGS: -Zmiri-tree-borrows

  games:
    name: games (${{ matrix.crate }})
    runs-on: ubuntu-latest
    env:
      PDX_FIXTURES_LOG: ${{ github.workspace }}/fixtures.log
    strategy:
      fail-fast: false
      matrix:
        include:
        - { crate: eu4save, game: eu4 }
        - { crate: ck3save, game: ck3 }
        - { crate: hoi4save, game: hoi4 }
        - { crate: imperator-save, game: imperator }
        - { crate: vic3save, game: vic3 }
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    # Only the ironman job saves the cache: it fetches a superset of the
    # fixtures, so one cache per game holds the full set.
    - name: Restore save fixtures
      uses: actions/cache/restore@v6
      with:
        path: assets/saves/${{ matrix.game }}
        key: saves-${{ matrix.game }}-${{ hashFiles(format('crates/{0}/tests/fixtures.txt', matrix.crate)) }}
        restore-keys: saves-${{ matrix.game }}-
    - name: Check jomini resolves from the workspace
      run: cargo tree -p ${{ matrix.crate }} -i jomini -e normal --depth 0 | grep -q 'crates/jomini'
    - name: Run tests
      run: cargo test -p ${{ matrix.crate }}
    - name: Check fixture list
      run: '! sort -u "$PDX_FIXTURES_LOG" | grep -vxFf crates/${{ matrix.crate }}/tests/fixtures.txt'

  # Runs the tests that need the private token files. GH_PAT is a
  # fine-grained repository secret with read access to pdx-tools/tokens (a
  # repository secret, not an environment one, as an environment marks every
  # run as a deployment). Fork and Dependabot pull requests get no secrets,
  # so the condition skips them. The saved cache must never include the
  # tokens directory: fork pull requests can restore it.
  ironman:
    name: ironman (${{ matrix.crate }})
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - { crate: eu4save, game: eu4 }
        - { crate: ck3save, game: ck3 }
        - { crate: hoi4save, game: hoi4 }
        - { crate: imperator-save, game: imperator }
        - { crate: vic3save, game: vic3 }
    env:
      PDX_TOKENS_DIR: ${{ github.workspace }}/.tokens/tokens
      PDX_FIXTURES_LOG: ${{ github.workspace }}/fixtures.log
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    - name: Cache save fixtures
      uses: actions/cache@v6
      with:
        path: assets/saves/${{ matrix.game }} # never the tokens directory
        key: saves-${{ matrix.game }}-${{ hashFiles(format('crates/{0}/tests/fixtures.txt', matrix.crate)) }}
        restore-keys: saves-${{ matrix.game }}-
    - name: Clone tokens
      uses: actions/checkout@v7
      with:
        repository: pdx-tools/tokens
        token: ${{ secrets.GH_PAT }}
        path: .tokens
        persist-credentials: false
    - name: Run tests
      run: cargo test -p ${{ matrix.crate }}
    - name: Remove tokens
      if: always()
      run: rm -rf .tokens
    - name: Check fixture list
      run: '! sort -u "$PDX_FIXTURES_LOG" | grep -vxFf crates/${{ matrix.crate }}/tests/fixtures.txt'

  test:
    name: test
    runs-on: ${{ matrix.os }}
    env:
      CARGO: cargo
      TARGET:
      # The cross-compile legs run only the library crates. Game crates get
      # their own linux-only job.
      PKGS: -p jomini -p jomini_derive -p arena-serde -p arena-serde-derive
    strategy:
      matrix:
        build:
        - stable
        - beta
        - nightly
        - macos
        - win-msvc
        - big-endian
        - stable-32
        include:
        - build: stable
          os: ubuntu-latest
          rust: stable
        - build: beta
          os: ubuntu-latest
          rust: beta
        - build: nightly
          os: ubuntu-latest
          rust: nightly
        - build: macos
          os: macos-latest
          rust: stable
        - build: win-msvc
          os: windows-latest
          rust: stable
        - build: big-endian
          os: ubuntu-latest
          rust: stable
          target: powerpc64-unknown-linux-gnu
        - build: stable-32
          os: ubuntu-latest
          rust: stable
          target: i686-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Use Cross
      if: matrix.target != ''
      run: |
        cargo install cross
        echo "CARGO=cross" >> $GITHUB_ENV
        echo "TARGET=--target ${{ matrix.target }}" >> $GITHUB_ENV
    - name: Build
      run: ${{ env.CARGO }} build ${{ env.PKGS }} --verbose ${{ env.TARGET }}
    - name: Run default features tests
      run: ${{ env.CARGO }} test ${{ env.PKGS }} --verbose ${{ env.TARGET }}
    - name: Run no-default-feature tests
      run: ${{ env.CARGO }} test --no-default-features ${{ env.PKGS }} --verbose ${{ env.TARGET }}
    - name: Run json tests
      run: ${{ env.CARGO }} test --features json ${{ env.PKGS }} --verbose ${{ env.TARGET }}
    - name: Run envelope tests
      run: ${{ env.CARGO }} test --features envelope ${{ env.PKGS }} --verbose ${{ env.TARGET }}
    - name: Run all-features tests
      run: ${{ env.CARGO }} test --all-features ${{ env.PKGS }} --verbose ${{ env.TARGET }}
    - name: Run serde-only tests (no derive macros)
      run: ${{ env.CARGO }} test --no-default-features --features serde ${{ env.PKGS }} --verbose ${{ env.TARGET }}

    - name: Compile fuzz
      if: matrix.build == 'nightly'
      run: |
        cargo install cargo-fuzz
        cargo fuzz build fuzz_binary
        cargo fuzz build fuzz_scalar_text
        cargo fuzz build fuzz_text
        cargo fuzz build fuzz_date
        cargo fuzz build fuzz_envelope
        cargo fuzz build fuzz_eu4
        cargo fuzz build fuzz_ck3
        cargo fuzz build fuzz_hoi4
        cargo fuzz build fuzz_imperator
        cargo fuzz build fuzz_vic3
