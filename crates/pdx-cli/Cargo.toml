[package]
name = "pdx-cli"
version = "0.1.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
publish = false
description = "Development CLI for the game save crates"

[[bin]]
name = "pdx"
path = "src/main.rs"

[dependencies]
arena-serde = { path = "../arena-serde" }
ck3save = { path = "../ck3save", features = ["zstd_c"] }
eu4save = { path = "../eu4save" }
eu5save = { path = "../eu5save", features = ["zstd_c"] }
hoi4save = { path = "../hoi4save" }
imperator-save = { path = "../imperator-save", features = ["zstd_c"] }
jomini = { workspace = true, features = ["envelope", "json", "zstd_c"] }
pdx-fixtures = { workspace = true }
vic3save = { path = "../vic3save", features = ["zstd_c"] }
