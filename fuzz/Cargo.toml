[package]
name = "jomini-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
json = ["jomini/json"]

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1.0", features = ["derive"] }

[dependencies.jomini]
path = "../crates/jomini"
features = ["envelope"]

[dependencies.eu4save]
path = "../crates/eu4save"

[dependencies.ck3save]
path = "../crates/ck3save"

[dependencies.hoi4save]
path = "../crates/hoi4save"

[dependencies.imperator-save]
path = "../crates/imperator-save"

[dependencies.pdx-fixtures]
path = "../crates/pdx-fixtures"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_text"
path = "fuzz_targets/fuzz_text.rs"

[[bin]]
name = "fuzz_scalar_text"
path = "fuzz_targets/fuzz_scalar_text.rs"

[[bin]]
name = "fuzz_binary"
path = "fuzz_targets/fuzz_binary.rs"

[[bin]]
name = "fuzz_date"
path = "fuzz_targets/fuzz_date.rs"
test = false
doc = false

[[bin]]
name = "fuzz_envelope"
path = "fuzz_targets/fuzz_envelope.rs"
test = false
doc = false

[[bin]]
name = "fuzz_eu4"
path = "fuzz_targets/fuzz_eu4.rs"
test = false
doc = false

[[bin]]
name = "fuzz_ck3"
path = "fuzz_targets/fuzz_ck3.rs"
test = false
doc = false

[[bin]]
name = "fuzz_hoi4"
path = "fuzz_targets/fuzz_hoi4.rs"
test = false
doc = false

[[bin]]
name = "fuzz_imperator"
path = "fuzz_targets/fuzz_imperator.rs"
test = false
doc = false
